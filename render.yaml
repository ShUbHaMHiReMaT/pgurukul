databases:
  - name: pgurukul-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: pgurukul
    runtime: python
    rootDir: pgurukul
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pgurukul-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
