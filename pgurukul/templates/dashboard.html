{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}"/>
{% endblock %}

{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--color-bg);">
  <div class="card" style="max-width:480px;width:100%;padding:var(--space-8);text-align:center;">
    <div class="auth-logo" style="justify-content:center;margin-bottom:var(--space-5);">
      <div class="auth-logo-icon">PG</div>
      <div style="text-align:left;">
        <div class="auth-logo-text">PGURUKUL</div>
        <div class="auth-logo-sub">Collaboration Platform</div>
      </div>
    </div>

    <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:var(--space-2);">Welcome, {{ display_name }}</h1>
    <span class="badge {% if role == 'admin' %}badge-danger{% else %}badge-neutral{% endif %}" style="margin-bottom:var(--space-6);display:inline-block;">
      {{ role.title() }}
    </span>

    <p style="color:var(--color-text-3);margin-bottom:var(--space-6);">
      You're signed in as <strong>@{{ username }}</strong>.
    </p>

    <a href="{{ url_for('logout') }}" class="btn btn-secondary w-full">Sign Out</a>
  </div>
</div>
{% endblock %}
