{% extends "base.html" %}
{% block title %}413 – File Too Large{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:40px;background:var(--color-bg);">
  <div style="font-size:5rem;">📦</div>
  <h1 style="font-size:4rem;font-weight:900;letter-spacing:-0.04em;margin:0;">413</h1>
  <h2 style="font-size:1.25rem;color:var(--color-text-2);margin:0;">File Too Large</h2>
  <p style="color:var(--color-text-3);max-width:400px;">The file you tried to upload exceeds the 100MB limit.</p>
  <a href="javascript:history.back()" class="btn btn-primary">← Go Back</a>
</div>
{% endblock %}
